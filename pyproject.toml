[project]
name = "sfcverify"
version = "1.0.0"
description = "Runtime structural verification of SFC executions with the fired-transition matrix"
requires-python = ">=3.10"
dependencies = ["numpy", "sympy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
sfcverify = "sfcverify.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sfcverify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
